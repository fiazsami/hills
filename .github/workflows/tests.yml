# Builds and runs this submodule's test suite on every pull request.
#
# This is a smoke test, NOT the coverage gate. The gate lives in the
# screen-savers superproject -- tools/coverage.sh plus coverage/<name>.json --
# and cannot run here: the superproject is private, and it is where the source
# list, the include paths and the ratchet baseline live. A PR in this repo
# therefore cannot tell you whether coverage held. It can tell you the suite
# still compiles and still passes, which is the part a reviewer of this repo
# would otherwise have no way to check at all.
#
# The build recipe below duplicates a little of that config by necessity. If the
# two ever disagree, coverage/<name>.json in the superproject is the authority
# and this file is the thing that is wrong.
#
# The job is named "tests" because that string is the check context required by
# branch protection on master. Renaming the job silently disables the gate.

name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the test suite
        run: |
          set -euo pipefail
          OUT=.ci-build
          rm -rf "$OUT"; mkdir -p "$OUT"
          INC=(-I"Source Code" -Itests)
          SOURCES=()
          SOURCES+=("Source Code/Camera.m")
          while IFS= read -r f; do SOURCES+=("$f"); done < <(find tests -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.m" -o -name "*.mm" \) | sort)
          [ ${#SOURCES[@]} -gt 0 ] || { echo "no sources found" >&2; exit 1; }
          n=0
          for src in "${SOURCES[@]}"; do
            n=$((n + 1))
            case "$src" in
              *.m)  xcrun clang   -x objective-c              "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *.mm) xcrun clang++ -x objective-c++ -std=c++17 "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *.c)  xcrun clang                               "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *)    xcrun clang++ -std=c++17                  "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
            esac
          done
          xcrun clang++ "$OUT"/*.o -framework Foundation -framework OpenGL -o "$OUT/tests"
          "$OUT/tests"

      # The suite above compiles Camera.m plus the drivers and never opens the
      # Xcode project, so until this step existed a completely broken Release
      # build stayed green. That is not hypothetical: every target once failed on
      # the removed libarclite, and hills failed again underneath that on a
      # missing AGL framework. Both went unnoticed through the whole of phase 1,
      # because nothing in CI had ever built a screen saver.
      #
      # hills is the repo where this matters most. Its testable scope is one
      # file, so the clang suite above covers 191 of 2849 lines of Objective-C --
      # everything else reaches CI only through this step.
      #
      # Both targets, because they have separate signing settings and only the
      # app carries ENABLE_HARDENED_RUNTIME. Both configurations too: Debug
      # carries the same signing keys and is the first build a new contributor
      # runs, and restoring its pre-change values reproduces a hard failure that
      # a Release-only step could not see.
      #
      # Deliberately passes no signing overrides: a runner has no certificate, so
      # a green run here is the evidence that the committed settings build for
      # someone who is not the author.
      #
      # Building is not enough on its own, which review caught: the distinction
      # this project argues for -- explicit "-" seals the bundle, an emptied key
      # yields an unsealed linker-signed one -- produces ** BUILD SUCCEEDED **
      # either way. Only the signature tells them apart, so assert it.
      - name: Build and verify both savers
        run: |
          set -euo pipefail

          # A team ID in the project file, in either spelling. DEVELOPMENT_TEAM is
          # the build setting; DevelopmentTeam is what Xcode writes under
          # TargetAttributes, and hyperspace shipped one there that a grep for the
          # first spelling missed entirely. hills has no TargetAttributes block
          # today; this is here so that stays true. Only "" is permitted.
          #
          # This lives here as well as in the superproject's commit hook because
          # the two catch different things: the hook sees commits made through
          # that harness, CI sees whatever actually arrives on a branch.
          if grep -nE '(DEVELOPMENT_TEAM|DevelopmentTeam)[[:space:]]*=' \
               Hills.xcodeproj/project.pbxproj | grep -vE '=[[:space:]]*"";'; then
            echo "::error::project.pbxproj carries a non-empty development team (shown above)"
            exit 1
          fi

          verify() {
            echo "verifying $1"
            codesign --verify --strict --verbose=4 "$1"
            # Captured first rather than piped into grep -q. Under pipefail a
            # grep that exits on its first match can SIGPIPE the still-writing
            # codesign (141), which propagates as the pipeline's status and
            # reports a signing regression on a perfectly good bundle.
            seal=$(codesign -dv "$1" 2>&1 || true)
            printf '%s\n' "$seal" | grep -q "^Sealed Resources" || {
              echo "::error::$1 has no sealed resources -- signing regressed to linker-signed"
              exit 1
            }
          }

          # Every combination is attempted before the step fails. Under a bare
          # set -e the first failing target would skip the second, which defeats
          # the reason this builds both -- one run should report everything that
          # is broken, not the first thing.
          failed=""
          for target in "Hills Screensaver" "Hills Application"; do
            for configuration in Release Debug; do
              if ! xcodebuild -project Hills.xcodeproj -target "$target" \
                     -configuration "$configuration" build; then
                failed="$failed $target / $configuration%0A"
              fi
            done
          done
          if [ -n "$failed" ]; then
            # %0A rather than a real newline: GitHub parses only the first
            # line of a ::error:: command, so embedded newlines hid every
            # failure after the first -- defeating the reason this loops over
            # all four combinations instead of stopping at the first.
            echo "::error::build failed for:%0A$failed"
            exit 1
          fi

          for configuration in Release Debug; do
            verify "build/$configuration/Hills.saver"
            verify "build/$configuration/Hills.app"
          done
